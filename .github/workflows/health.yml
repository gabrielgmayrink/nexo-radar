name: Independent Radar Health
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: radar-health
  cancel-in-progress: false
jobs:
  health:
    if: vars.RADAR_MONITORING_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check collection, database and storage health
        run: python scripts/check_health.py
        env:
          RADAR_APP_URL: ${{ vars.RADAR_APP_URL }}
