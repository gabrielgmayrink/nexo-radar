name: Notify Radar
on:
  schedule:
    - cron: '20 11 * * *'
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [weekly, urgent, test, verify, verify_smtp, delivery_test]
        default: verify
permissions:
  contents: read
  id-token: write
concurrency:
  group: radar-notifications
  cancel-in-progress: false
jobs:
  notify:
    if: vars.RADAR_EMAIL_ENABLED == '1' || (github.event_name == 'workflow_dispatch' && (inputs.kind == 'verify' || inputs.kind == 'verify_smtp' || inputs.kind == 'delivery_test'))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/run_notifications.py
        env:
          RADAR_APP_URL: ${{ vars.RADAR_APP_URL }}
          RADAR_NOTIFY_KIND: ${{ github.event.schedule == '20 11 * * *' && 'urgent' || inputs.kind }}
