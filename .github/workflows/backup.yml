name: Encrypted Radar Backup
on:
  schedule:
    - cron: '41 6 * * *' # 03:41 Brasília
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radar-encrypted-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main' && vars.RADAR_BACKUP_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: backup
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install reviewed runtime dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Generate, validate and upload encrypted archive
        env:
          PYTHONPATH: src
          POSTGRES_URL_NON_POOLING: ${{ secrets.RADAR_BACKUP_DATABASE_URL }}
          RADAR_BACKUP_ENCRYPTION_KEY: ${{ secrets.RADAR_BACKUP_ENCRYPTION_KEY }}
          RADAR_BACKUP_S3_BUCKET: ${{ vars.RADAR_BACKUP_S3_BUCKET }}
          RADAR_BACKUP_S3_PREFIX: ${{ vars.RADAR_BACKUP_S3_PREFIX }}
          RADAR_BACKUP_S3_ENDPOINT: ${{ vars.RADAR_BACKUP_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RADAR_BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RADAR_BACKUP_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.RADAR_BACKUP_AWS_REGION }}
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          pg_dump --version
          aws --version
          archive="$RUNNER_TEMP/radar.nexo-backup"
          trap 'rm -f "$archive"' EXIT
          python scripts/backup_database.py backup --archive "$archive"
          python scripts/backup_database.py validate --archive "$archive"
          python scripts/backup_upload.py --archive "$archive" --verify-download
