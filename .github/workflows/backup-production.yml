name: Production Encrypted Backup
on:
  push:
    branches: [codex/seguranca-cobertura-qualidade]
    paths: [.github/workflows/backup-production.yml, scripts/verify_production_backup.py, scripts/verify_staging_backup.py]
  schedule:
    - cron: '41 6 * * 1' # Segunda 03h41 Brasília; cópia completa e restauração semanal
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexo-production-backup
  cancel-in-progress: false
jobs:
  restore:
    if: (github.ref == 'refs/heads/main' && vars.RADAR_BACKUP_ENABLED == '1') || (github.ref == 'refs/heads/codex/seguranca-cobertura-qualidade' && github.sha == vars.RADAR_RELEASE_BACKUP_SHA)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        # Official Supabase self-hosting compose image, compatible extensions.
        image: supabase/postgres:17.6.1.136
        env:
          POSTGRES_PASSWORD: disposable-local-fixture
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        volumes: ['/tmp/nexo-production-backup:/tmp/nexo-production-backup']
        options: --health-cmd "pg_isready -U postgres -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install reviewed tools
        run: |
          python -m pip install --require-hashes -r requirements.lock
          npm ci --prefix scripts
      - name: Prepare isolated compatible restore target
        env:
          RESTORE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" /tmp/nexo-production-backup
          docker cp src/radar/certificates/supabase-prod-ca-2021.crt "$RESTORE_CONTAINER:/tmp/nexo-ca.crt"
          mkdir -p "$RUNNER_TEMP/pg-tools"
          cat > "$RUNNER_TEMP/pg-tools/pg_dump" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker exec --user "$(id -u):$(id -g)" -e PGHOST -e PGPORT -e PGDATABASE -e PGUSER -e PGPASSWORD -e PGSSLMODE -e PGSSLROOTCERT=/tmp/nexo-ca.crt "$RESTORE_CONTAINER" "$(basename "$0")" "$@"
          SCRIPT
          cp "$RUNNER_TEMP/pg-tools/pg_dump" "$RUNNER_TEMP/pg-tools/pg_restore"
          cp "$RUNNER_TEMP/pg-tools/pg_dump" "$RUNNER_TEMP/pg-tools/psql"
          chmod 700 "$RUNNER_TEMP/pg-tools/"*
          echo "$RUNNER_TEMP/pg-tools" >> "$GITHUB_PATH"
          docker exec -e PGPASSWORD=disposable-local-fixture "$RESTORE_CONTAINER" psql -U postgres -h 127.0.0.1 -v ON_ERROR_STOP=1 -c 'create database radar_restore_test_cloud template template0'
      - name: Snapshot, encrypt, upload, download and restore
        # Source credential has read-only SQL privileges; restore uses only the disposable local administrator.
        env:
          PYTHONPATH: src
          RESTORE_CONTAINER: ${{ job.services.postgres.id }}
          RADAR_SUPABASE_PROJECT_REF: hxngkmrsthyjycxaellk
          SUPABASE_URL: https://hxngkmrsthyjycxaellk.supabase.co
          POSTGRES_URL_NON_POOLING: ${{ secrets.RADAR_BACKUP_DATABASE_URL }}
          RADAR_BACKUP_ENCRYPTION_KEY: ${{ secrets.RADAR_BACKUP_ENCRYPTION_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.RADAR_BACKUP_BLOB_TOKEN }}
          RADAR_BACKUP_BLOB_STORE_ID: store_nWhQQDeLrxT29Mr1
          RADAR_BACKUP_WORK_ROOT: /tmp/nexo-production-backup
          RADAR_RESTORE_TEST_URL: postgresql://supabase_admin:disposable-local-fixture@127.0.0.1:5432/radar_restore_test_cloud
          RADAR_BACKUP_PROOF_PATH: backup-proof.json
          RADAR_PRODUCTION_BACKUP_ALLOWED: '1'
        run: python scripts/verify_production_backup.py
