name: Collect Radar
on:
  schedule:
    - cron: '15 3,9,15,21 * * *'
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [incremental, backfill, open]
        default: incremental
permissions:
  contents: read
  id-token: write
concurrency:
  group: radar-collection
  cancel-in-progress: false
jobs:
  collect:
    if: vars.RADAR_COLLECTION_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/run_scheduled_collection.py
        env:
          RADAR_APP_URL: ${{ vars.RADAR_APP_URL }}
          RADAR_SYNC_KIND: ${{ inputs.kind || 'incremental' }}
