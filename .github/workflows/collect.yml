name: Collect Radar
on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:
    inputs:
      kind:
        type: choice
        options: [national_open, diagnostic, incremental, backfill, open]
        default: national_open
      budget:
        description: 'Tempo máximo: coleta normal ou checagem curta com progresso salvo'
        type: choice
        options: ['480', '120']
        default: '480'
      national_budget:
        type: choice
        options: ['3600', '5400', '120']
        default: '3600'
permissions:
  contents: read
  id-token: write
concurrency:
  group: radar-collection
  cancel-in-progress: false
jobs:
  collect:
    if: vars.RADAR_COLLECTION_ENABLED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: inputs.kind == 'diagnostic'
        run: python scripts/probe_pncp_source.py
      - if: github.event_name == 'schedule' || inputs.kind == 'national_open'
        run: python scripts/run_national_collection.py
        env:
          PYTHONPATH: src
          RADAR_APP_URL: ${{ vars.RADAR_APP_URL }}
          RADAR_NATIONAL_BUDGET_SECONDS: ${{ inputs.national_budget || '3600' }}
      - if: github.event_name == 'workflow_dispatch' && inputs.kind != 'diagnostic' && inputs.kind != 'national_open'
        run: python scripts/run_scheduled_collection.py
        env:
          RADAR_APP_URL: ${{ vars.RADAR_APP_URL }}
          RADAR_SYNC_KIND: ${{ inputs.kind || 'incremental' }}
          RADAR_SYNC_BUDGET_SECONDS: ${{ inputs.budget || '480' }}
