name: Validate Radar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-ci-fixture
          POSTGRES_DB: radar_restore_test_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Backend tests
        env:
          PYTHONPATH: src
          RADAR_TEST_POSTGRES_DSN: postgresql://postgres:local-ci-fixture@127.0.0.1:5432/radar_restore_test_ci
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
          python tests/bootstrap_postgres.py
          python -m unittest discover -s tests -v
      - name: Scan project for committed credentials
        run: python scripts/check_secrets.py
      - name: Check Python syntax and undefined names
        run: |
          python -m pip install ruff==0.17.4
          python -m ruff check src api scripts tests --select E9,F821,F822,F823
      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --disable-pip --no-deps --strict

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm audit --prefix web --audit-level=high
      - run: npm run build --prefix web
      - run: node scripts/test_search_logic.mjs
      - run: node scripts/test_login_token.mjs
      - run: node scripts/test_catalog_search.mjs
